services:
  - type: web
    name: dataflow-cleaner-api
    runtime: python
    # FREE tier: sleeps after 15 min idle (~50s wake-up). Without this line
    # Render defaults new services to the paid Starter plan.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Pinned to one worker ON PURPOSE: sessions/results live in process
    # memory (see backend/session_store.py). Any --workers > 1, autoscale
    # replica, or second instance shards sessions (upload on A → 404 on B).
    # Migrate to a shared store before scaling; see README.
    # --proxy-headers trusts Render's reverse proxy so rate limits key on the
    # real client IP (otherwise every visitor shares the proxy's bucket).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URLS
        # Production Sieve URL on Vercel (project `dataflow-cleaner`,
        # Root Directory `frontend-sieve`). Must match exactly (no trailing
        # slash) or browsers block the API.
        value: https://dataflow-cleaner.vercel.app
      - key: PIPELINES_READ_ONLY
        # Account-scoped templates are user-facing (Saved button): signed-in
        # users may save/delete their own. Flip to "true" to freeze the
        # library while keeping reads open.
        value: "false"
      # Neon PostgreSQL connection string, pasted in the Render dashboard
      # (Environment -> DATABASE_URL). `sync: false` makes Render prompt for
      # it instead of storing the secret in this file.
      #
      # Why Neon and not Render Free Postgres: Render free databases expire
      # 30 days after creation; Neon's free plan does not. Never deploy
      # mandatory login on a database that is scheduled to disappear.
      #
      # Expected shape:
      #   postgresql://USER:PASSWORD@HOST/DB?sslmode=require
      - key: DATABASE_URL
        sync: false
