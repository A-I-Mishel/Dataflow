services:
  - type: web
    name: dataflow-cleaner-api
    runtime: python
    # FREE tier: sleeps after 15 min idle (~50s wake-up). Without this line
    # Render defaults new services to the paid Starter plan.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Pinned to one worker ON PURPOSE: sessions/results live in process
    # memory (see backend/session_store.py). Any --workers > 1, autoscale
    # replica, or second instance shards sessions (upload on A → 404 on B).
    # Migrate to a shared store before scaling; see README.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URLS
        # Replace with your Sieve Vercel URL after deploying the frontend
        # (Vercel project with Root Directory `frontend-sieve`).
        value: https://dataflow-sieve.vercel.app
      # Uncomment the DATABASE_URL block below together with the database
      # below to keep saved pipelines across sleeps (free Postgres expires
      # after 90 days; without it the app uses SQLite on ephemeral disk).
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: dataflow-db
      #     property: connectionString

#databases:
