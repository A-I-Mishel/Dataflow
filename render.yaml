services:
  - type: web
    name: dataflow-cleaner-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URLS
        # Replace with your Vercel URL after deploying the frontend.
        value: https://dataflow-cleaner.vercel.app
